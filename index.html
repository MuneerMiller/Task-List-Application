<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple task list: add tasks, tick them off and clear completed ones. Your list is saved in your browser.">
    <title>Task List</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>
<body>
    <main class="container">
        <h1 id="head-text">Task List</h1>
        <form id="newTask" novalidate>
            <label for="taskInput" class="visually-hidden">New task</label>
            <input type="text" id="taskInput" placeholder="Add a task" maxlength="200" autocomplete="off" aria-describedby="taskError">
            <button type="submit" id="push">Add</button>
        </form>
        <p id="taskError" class="error" role="alert" aria-live="polite"></p>
        <p id="emptyState" class="empty-state">No tasks yet. Add one above to get started.</p>
        <ul class="tasks" aria-label="Tasks"></ul>
        <div class="footer">
            <span id="summary" aria-live="polite"></span>
            <button id="clear-completed" class="clear-completed" type="button">Clear completed</button>
        </div>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
